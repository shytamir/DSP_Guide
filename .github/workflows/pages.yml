name: Validate and package static guide

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.version.outputs.archive }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up authoring runtime
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned authoring dependencies
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts

      - name: Resolve deployment version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source VERSION

          if [[ ! "$MAJOR" =~ ^[0-9]+$ || ! "$MINOR" =~ ^[0-9]+$ ]]; then
            echo "VERSION must define numeric MAJOR and MINOR values." >&2
            exit 1
          fi

          sequence=$((GITHUB_RUN_NUMBER - 1))
          short_sha="$(git rev-parse --short=7 "$GITHUB_SHA")"
          version="${MAJOR}.${MINOR}.${sequence}.${short_sha}"
          archive="dsp-practical-progression-guide-${version}.zip"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "DEPLOYMENT_VERSION=$version" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Validate authoring contracts
        run: |
          node scripts/validate-source-readability.mjs
          node scripts/validate-card-system.mjs
          node scripts/validate-checklists.mjs
          node scripts/validate-terminology.mjs
          node scripts/localization-source.mjs
          node scripts/test-localization.mjs

      - name: Validate and stage committed static website
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-static-editions.mjs --stage _site

      - name: Validate staged website
        run: |
          node scripts/validate-localization.mjs _site
          node scripts/validate-deployment.mjs _site .

      - name: Create deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          (
            cd _site
            zip -q -r "../${DEPLOYMENT_ARCHIVE}" .
          )

          mkdir _package-verification
          unzip -q "$DEPLOYMENT_ARCHIVE" -d _package-verification
          node scripts/validate-localization.mjs _package-verification
          node scripts/validate-deployment.mjs _package-verification .

      - name: Upload versioned deployment package
        uses: actions/upload-artifact@v7
        with:
          name: dsp-practical-progression-guide-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Summarize package
        shell: bash
        run: |
          {
            echo "### Static guide package"
            echo
            echo "- Version: \`${DEPLOYMENT_VERSION}\`"
            echo "- ZIP: \`${DEPLOYMENT_ARCHIVE}\`"
            echo "- Contents: enabled static editions, local assets, LICENSE, and sanitized permission; private catalogs and authoring dependencies excluded"
          } >> "$GITHUB_STEP_SUMMARY"
